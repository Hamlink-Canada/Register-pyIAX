[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rpt-iax-register"
version = "1.1.0"
description = "IAX repeater registration"
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["rpt-protobuf[grpc] @ git+https://github.com/Hamlink-Canada/rpt_protobuf.git@main", "dynaconf>=3.3.5,<4", "confluent-kafka>=2.16,<3", "cachetools>=8,<9"]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "opentelemetry-distro>=0.51b0",
  "opentelemetry-instrumentation-confluent-kafka>=0.51b0",
  "opentelemetry-instrumentation-system-metrics>=0.51b0",
  "opentelemetry-instrumentation-logging>=0.51b0",
]

[project.scripts]
rpt-iax = "rpt_iax.cli:main"

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "build>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
rpt-protobuf = { path = "../rpt_protobuf", editable = true }
